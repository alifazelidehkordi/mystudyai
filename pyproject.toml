[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mystudyai"
version = "0.1.0"
description = "Course-first, source-grounded medical study tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.23,<2",
  "python-pptx>=0.6.23,<2",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
mystudyai = "mystudyai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
